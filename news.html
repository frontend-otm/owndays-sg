    <script>
        /* =====================================================================
         * PAGE LOGIC — no changes needed here when adding news
         * ===================================================================== */
        const categoriesEl = document.getElementById("newsCategories");
        const newsListEl = document.getElementById("newsList");
        const featuredNewsEl = document.getElementById("featuredNews");

        let selectedCategory = "ALL";

        const categoryNames = NEWS_CATEGORIES.map((cat) => cat.name);
        ITEMS_NEWS.forEach((item) => {
            if (!categoryNames.includes(item.category)) {
                console.warn(`news: unknown category "${item.category}" for ${item.slug}`);
            }
        });

        function isVisible(item) {
            if (item.hidden) return false;
            return !item.startDate || new Date() >= new Date(item.startDate);
        }

        function getVisibleNews() {
            return ITEMS_NEWS.filter(
                (item) => isVisible(item) && (selectedCategory === "ALL" || item.category === selectedCategory)
            );
        }

        function renderCategories() {
            categoriesEl.innerHTML = NEWS_CATEGORIES
                .map((cat) => {
                    const className = cat.name === selectedCategory ? "selected-new-category" : "";
                    return `<li class="${className}" data-category="${cat.name}">${cat.name}</li>`;
                })
                .join("");
        }

        function renderFeatured(item) {
            featuredNewsEl.innerHTML = !item ? "" : `
                <a href="${item.slug}" style="display: flex;">
                    <figure class="body-news__news__card">
                        <div class="body-news__news-thumbnail">
                            <img alt="${item.title}" src="${item.image}" />
                        </div>
                        <figcaption>
                            <div class="body-news__news-details">
                                <div class="body-news__news-text">
                                    <p class="body-news__news-category">${item.category}</p>
                                    <h2 class="body-news__news-title">
                                        ${item.title}
                                    </h2>
                                    <p class="body-news__news-description">
                                        ${item.description}
                                    </p>
                                </div>
                                <p class="body-news__news-link">VIEW MORE</p>
                            </div>
                        </figcaption>
                    </figure>
                </a>`;
        }

        function renderList(items) {
            newsListEl.innerHTML = items
                .map((item, index) => `
                    <li data-aos="zoom-in" data-aos-delay="${index * 100}">
                        <a href="${item.slug}">
                            <figure>
                                <div class="blog-news__list-thumbnail">
                                    <img src="${item.image}" alt="${item.title}" loading="lazy">
                                </div>
                                <figcaption>
                                    <h4 class="blog-news__list-category">${item.category}</h4>
                                    <p class="blog-news__list-title">${item.title}</p>
                                    <p class="blog-news__list-view-more">VIEW MORE</p>
                                </figcaption>
                            </figure>
                        </a>
                    </li>`)
                .join("");
        }

        function render() {
            const items = getVisibleNews();
            renderCategories();
            renderFeatured(items[0]);
            renderList(items);
        }

        categoriesEl.addEventListener("click", (e) => {
            const tab = e.target.closest("li[data-category]");
            if (!tab) return;
            selectedCategory = tab.dataset.category;
            render();
        });

        document.addEventListener("DOMContentLoaded", function () {
            render();
            AOS.init({
                duration: 800,
                once: true,
            });
        });
    </script>
