  <script>
    /* =====================================================================
     * PAGE LOGIC — no changes needed here when adding brands
     * ===================================================================== */
    document.addEventListener("DOMContentLoaded", function () {
      setTimeout(() => {

        const ITEMS_PER_ROW = 4;
        const SLICK_OPTIONS = {
          slidesToShow: 1,
          dots: true,
          arrows: true,
          infinite: true,
          adaptiveHeight: true,
          speed: 400,
          cssEase: "ease"
        };

        const list = document.querySelector(".brands__list");
        const jq = window.jQuery;

        if (!jq) {
          console.error("brands: jQuery not found; Slick cannot initialize.");
        }

        const brandsById = {};
        BRANDS.forEach((brand) => {
          if (brandsById[brand.id]) {
            console.warn(`brands: duplicate id "${brand.id}"`);
          }
          brandsById[brand.id] = brand;
        });

        // ---------- Cards ----------

        function isReleased(dateString) {
          return !dateString || new Date() >= new Date(dateString);
        }

        const visibleBrands = BRANDS.filter((brand) => !brand.hidden && isReleased(brand.startDate));

        list.innerHTML = visibleBrands
          .map((brand) => `
            <li>
              <div class="brands__card" data-brand="${brand.id}"><img src="${brand.thumbnail}" alt="${brand.title}" loading="lazy"></div>
            </li>`)
          .join("");

        const cards = Array.from(list.querySelectorAll(".brands__card"));

        // ---------- Details panel ----------

        function buildActions(brand) {
          const links = [];
          if (brand.productsLink) {
            links.push({ href: brand.productsLink, label: "See All Products", className: "" });
          }
          if (brand.detailsLink && isReleased(brand.detailsStartDate)) {
            links.push({ href: brand.detailsLink, label: "More Details", className: "brands__display" });
          }

          // A single button spans the full width
          const fullClass = links.length === 1 ? "button--full" : "";
          return links
            .map(({ href, label, className }) => {
              const classes = ["button", "button--secondary", className, fullClass].filter(Boolean).join(" ");
              return `<a class="${classes}" href="${href}">${label}</a>`;
            })
            .join("\n");
        }

        function createDetails(brand) {
          const li = document.createElement("li");
          li.className = "brands__details is-visible";
          li.dataset.brand = brand.id;

          const slidesHTML = brand.slides
            .map((src) => `<div><div><img src="${src}" alt="${brand.title}" loading="lazy"></div></div>`)
            .join("");

          const logoClass = [
            "brands__details-logo",
            brand.logoExtended && "brands__details-logo--expanded",
            brand.logoFull && "brands__details-logo--full",
            brand.overflow && "brands__details-logo--overflow",
            `brands__details-logo--${brand.id}`
          ].filter(Boolean).join(" ");

          li.innerHTML = `
            <button class="brands__details-close">
              <img src="https://static.lenskart.com/media/owndays/img/icons/close.svg" alt="Close">
            </button>

            <div class="brands__details-slider is-visible">
              <div class="brands__slider">${slidesHTML}</div>
            </div>

            <div class="brands__details-content">
              <h2 class="${logoClass}">${brand.title}
                <img src="${brand.logo}" alt="${brand.title}">
              </h2>
              <p class="brands__details-recommended">Recommended for : ${brand.recommended}</p>
              <div class="brands__details-bottom">
                <div class="brands__details-actions">
                  ${buildActions(brand)}
                </div>
                <p class="brands__details-description">${brand.description}</p>
                ${brand.tagline ? `<p class="brands__details-title">${brand.tagline}</p>` : ""}
              </div>
            </div>`;
          return li;
        }

        // ---------- Slider ----------

        function refreshSlider(sliderEl) {
          if (jq && jq(sliderEl).hasClass("slick-initialized")) {
            jq(sliderEl).slick("setPosition");
          }
        }

        function initSlider(sliderEl) {
          if (!jq) return;
          if (typeof jq.fn.slick !== "function") {
            console.error("brands: Slick not loaded or jQuery.fn.slick missing.");
            return;
          }

          jq(sliderEl).slick(SLICK_OPTIONS);
          refreshSlider(sliderEl);

          // Recalculate sizes once lazy-loaded images arrive
          sliderEl.querySelectorAll("img").forEach((img) => {
            if (!img.complete) {
              img.addEventListener("load", () => refreshSlider(sliderEl), { once: true });
            }
          });
        }

        // ---------- Open / close ----------

        function closeDetails(details) {
          if (jq) {
            jq(details).find(".brands__slider.slick-initialized").slick("unslick");
          }
          details.remove();
        }

        function openDetails(card) {
          list.querySelectorAll(".brands__details").forEach(closeDetails);

          const brand = brandsById[card.dataset.brand];
          if (!brand) return;
          const details = createDetails(brand);

          // Insert after the last card in the clicked card's row
          const index = cards.indexOf(card);
          const rowLastCard = cards[Math.floor(index / ITEMS_PER_ROW) * ITEMS_PER_ROW + ITEMS_PER_ROW - 1];
          if (rowLastCard) {
            rowLastCard.parentNode.after(details);
          } else {
            list.appendChild(details);
          }

          // Initialize Slick only after the element is in the DOM
          initSlider(details.querySelector(".brands__slider"));

          setTimeout(() => {
            card.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 100);
        }

        list.addEventListener("click", (e) => {
          const closeButton = e.target.closest(".brands__details-close");
          if (closeButton) {
            closeDetails(closeButton.closest(".brands__details"));
            return;
          }

          const card = e.target.closest(".brands__card");
          if (card) openDetails(card);
        });

        window.addEventListener("resize", () => {
          list.querySelectorAll(".brands__details .brands__slider").forEach(refreshSlider);
        });
      }, 300);
    });
  </script>


</body>

</html>
